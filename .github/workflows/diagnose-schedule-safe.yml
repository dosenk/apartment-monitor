name: Verify recovered apartment timer
on:
  push:
    paths: ['.github/workflows/diagnose-schedule-safe.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Start owner check and verify delivery without exporting private data
        run: |
          python -u - <<'PY'
          import os,json,urllib.request,urllib.error,time,hashlib
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; bot=os.environ['TELEGRAM_BOT_TOKEN']; owner=os.environ['TELEGRAM_CHAT_ID'].strip()
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          def call(url,payload=None,headers={}):
              req=urllib.request.Request(url,data=json.dumps(payload).encode() if payload is not None else None,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0 (compatible; ApartmentMonitor/1.0)',**headers})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  e.read();raise RuntimeError('Diagnostic HTTP '+str(e.code)) from None
          def api(path,payload=None):
              result=call(base+path,payload,{'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
              assert result.get('success'),'Diagnostic API unsuccessful'
              return result['result']
          info=call(f'https://api.telegram.org/bot{bot}/getWebhookInfo')['result']
          result=call(info['url'],{'update_id':int(time.time()),'message':{'message_id':0,'chat':{'id':int(owner),'type':'private'},'text':'🔄 Проверить новые квартиры'}},{'X-Telegram-Bot-Api-Secret-Token':hashlib.sha256(bot.encode()).hexdigest()})
          assert result.get('ok') and result.get('id'),'Scan was not started'
          print('Control check started:',True)
          root=result['id']; current=root
          db=next(x for x in api('/d1/database?name=apartment-monitor-state&per_page=100') if x['name']=='apartment-monitor-state')['uuid']
          for attempt in range(36):
              detail=api('/workflows/apartment-monitor-scan/instances/'+current)
              output=detail.get('output') or {}
              if isinstance(output,str):
                  try: output=json.loads(output)
                  except ValueError: output={}
              if isinstance(output,dict) and output.get('continued'):
                  current=output['continued']
              elif isinstance(output,dict) and output.get('delivered'):
                  print('Telegram digest delivered:',True)
                  print('Partial source coverage:',output.get('partial',False))
                  break
              state=api('/d1/database/'+db+'/query',{'sql':'SELECT header_sent FROM scan_runs WHERE id=?','params':[root]})[0]['results']
              if state and state[0].get('header_sent'):
                  print('Telegram digest delivered:',True)
                  break
              if detail.get('status') in ['errored','terminated']:
                  print('Control check failed:',True);raise RuntimeError('Control check failed; private details omitted')
              print('Control check still processing:',True)
              time.sleep(10)
          else: raise RuntimeError('Control check still pending after verification window')
          PY
