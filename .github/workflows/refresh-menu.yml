name: Refresh apartment bot menu
on:
  push:
    paths: [.github/workflows/refresh-menu.yml]
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Show Telegram menu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          keyboard={'keyboard':[[{'text':'🔄 Проверить новые квартиры'}],
            [{'text':'⚙️ Настройки поиска'},{'text':'📋 Текущие настройки'}],
            [{'text':'ℹ️ Как пользоваться'}]],'resize_keyboard':True,'is_persistent':True}
          payload={'chat_id':os.environ['TELEGRAM_CHAT_ID'],
            'text':'📍 Выбор городов Беларуси доступен в настройках поиска. Кнопка «Текущие настройки» показывает сохранённый поиск.',
            'reply_markup':keyboard}
          url='https://api.telegram.org/bot'+os.environ['TELEGRAM_BOT_TOKEN']+'/sendMessage'
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r:
            data=json.load(r)
          assert data['ok'],data.get('description')
          print('Telegram menu refreshed.')
          PY