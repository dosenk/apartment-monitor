name: Verify multiuser owner migration
on:
  push:
    paths: ['.github/workflows/verify-multiuser.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Verify preserved owner access and login configuration
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,hashlib,time
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          chat=int(os.environ['TELEGRAM_CHAT_ID'])
          def call(url,payload=None,headers={}):
              req=urllib.request.Request(url,data=json.dumps(payload).encode() if payload else None,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0 (compatible; ApartmentMonitor/1.0)',**headers})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  e.read()
                  return {'ok':False,'http_status':e.code}
          info=call(f'https://api.telegram.org/bot{bot}/getWebhookInfo')['result']
          health=call(info['url'].replace('/telegram','/health'))
          print('Multiuser mode:',health.get('multi_user',False))
          print('Password login ready:',health.get('login_ready',False))
          assert health.get('multi_user')
          result=call(info['url'],{'update_id':int(time.time()),'message':{'message_id':0,'chat':{'id':chat,'type':'private'},'text':'/current'}},{'X-Telegram-Bot-Api-Secret-Token':hashlib.sha256(bot.encode()).hexdigest()})
          print('Owner settings request ok:',result.get('ok',False))
          assert result.get('ok')
          print('Pending Telegram updates:',info.get('pending_update_count',0))
          PY
