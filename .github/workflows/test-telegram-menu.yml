name: Check Telegram search menu

on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-telegram-menu.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Wait for menu deployment and request /start
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.request

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          request = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain',
              headers={'Authorization': f'Bearer {token}'})
          with urllib.request.urlopen(request, timeout=30) as response:
              domain = json.load(response)['result']['subdomain']
          url = f'https://apartment-monitor-bot.{domain}.workers.dev'
          bot = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = int(os.environ['TELEGRAM_CHAT_ID'])
          payload = {'update_id': int(time.time()), 'message': {
              'message_id': int(time.time()), 'date': int(time.time()),
              'chat': {'id': chat_id, 'type': 'private'},
              'from': {'id': chat_id, 'is_bot': False, 'first_name': 'Owner'},
              'text': '/start'}}
          for attempt in range(36):
              request = urllib.request.Request(url + '/telegram',
                  data=json.dumps(payload).encode(),
                  headers={'Content-Type': 'application/json',
                           'X-Telegram-Bot-Api-Secret-Token': hashlib.sha256(bot.encode()).hexdigest()})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.load(response)
                  assert result['ok'], result
                  print('Telegram /start handled; menu and keyboard sent to configured chat')
                  break
              except Exception as error:
                  if attempt == 35:
                      raise
                  print(f'Waiting for deployed menu: attempt {attempt + 1}, {type(error).__name__}')
                  time.sleep(10)
          PY
