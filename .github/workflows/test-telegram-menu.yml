name: Deliver Telegram search menu

on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-telegram-menu.yml']

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Send search keyboard to the configured chat
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          bot = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          url = f'https://api.telegram.org/bot{bot}/sendMessage'
          messages = [
              {
                  'chat_id': chat_id,
                  'text': 'Настройки поиска теперь доступны внизу чата. Откройте меню, выберите станции или линии, цену в BYN и при необходимости радиус, затем нажмите «Применить».',
                  'reply_markup': {'keyboard': [
                      [{'text': '🔄 Проверить новые квартиры'}],
                      [{'text': '⚙️ Настройки поиска'}]],
                      'resize_keyboard': True, 'is_persistent': True},
              },
              {
                  'chat_id': chat_id,
                  'text': 'Откройте настройки поиска:',
                  'reply_markup': {'inline_keyboard': [[
                      {'text': '⚙️ Настройки поиска', 'callback_data': 'prefs:home'}]]},
              },
          ]
          for payload in messages:
              request = urllib.request.Request(url, data=json.dumps(payload).encode(),
                  headers={'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['ok'], result.get('description', 'Bot API failed')
          print('Telegram keyboard and settings entry delivered to configured chat')
          PY
