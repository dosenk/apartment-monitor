name: Diagnose Cloudflare apartment scan

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-cloudflare.yml']
  workflow_dispatch:
    inputs:
      instance:
        description: Workflow instance ID
        required: true

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INSTANCE: ${{ inputs.instance || 'latest' }}
    steps:
      - name: Inspect Workflow steps
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          ident = os.environ['INSTANCE']
          if ident == 'latest':
              list_url = f'https://api.cloudflare.com/client/v4/accounts/{account}/workflows/apartment-monitor-scan/instances?per_page=5'
              with urllib.request.urlopen(urllib.request.Request(list_url, headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']}), timeout=30) as response:
                  listed = json.load(response)['result']
              instances = listed if isinstance(listed, list) else listed.get('instances', [])
              print('Recent instances:', [(x.get('id'), x.get('status')) for x in instances[:5]])
              ident = instances[0]['id']
          url = f'https://api.cloudflare.com/client/v4/accounts/{account}/workflows/apartment-monitor-scan/instances/{ident}'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)['result']
          print('Status:', result.get('status'), 'error:', result.get('error'), 'steps:', result.get('step_count'), 'output:', result.get('output'))
          for step in result.get('steps', [])[-15:]:
              print('Step:', step.get('name'), 'status:', step.get('status'))
              for attempt in step.get('attempts', [])[-1:]:
                  if attempt.get('error'):
                      print('  Error:', attempt['error'])
          PY
