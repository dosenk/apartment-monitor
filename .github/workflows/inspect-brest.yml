name: Inspect Brest city districts
on:
  push:
    paths: [.github/workflows/inspect-brest.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query district polygons
        run: |
          python - <<'PY'
          import urllib.request,json,base64,zlib
          url='https://nominatim.openstreetmap.org/lookup?osm_ids=R3626404,R3626405&format=geojson&polygon_geojson=1&polygon_threshold=0.0005'
          req=urllib.request.Request(url,headers={'User-Agent':'ApartmentMonitor/1.0 (personal bot; open map attribution)'})
          try:
            with urllib.request.urlopen(req,timeout=30) as r:d=json.load(r)
            print('FEATURES',[(x.get('properties',{}).get('display_name','')[:120],x.get('geometry',{}).get('type')) for x in d.get('features',[])])
            pack=base64.b64encode(zlib.compress(json.dumps(d,separators=(',',':')).encode(),9)).decode()
            print('DATA_BEGIN')
            for i in range(0,len(pack),900):print(pack[i:i+900])
            print('DATA_END')
          except Exception as e:print('ERROR',repr(e))
          PY