name: Probe apartment photos
on:
  push:
    paths: ['.github/workflows/probe-images.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify public image URLs and send one photo preview
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from monitor import fetch_onliner, fetch_realt, fetch_kufar, matches, telegram_call
          from urllib.request import Request, urlopen
          import os
          cutoff=datetime.now(timezone.utc)-timedelta(hours=24)
          for source, fetch in (("onliner",fetch_onliner),("realt",fetch_realt),("kufar",fetch_kufar)):
              items=fetch(cutoff)
              found=next((x for x in items if x.photo_url and matches(x,500,None,set(),None,(53.915833,27.583333),3)),None)
              if not found:
                  print(source, "NO_MATCH_WITH_PHOTO", flush=True)
                  continue
              request=Request(found.photo_url,headers={"User-Agent":"Mozilla/5.0"})
              with urlopen(request,timeout=15) as response:
                  prefix=response.read(12)
                  print(source,found.key,"PHOTO",response.status,response.headers.get("content-type"),prefix.hex(),flush=True)
              if source=="kufar":
                  caption=f"🧪 Проверка фото · Kufar\n{found.address}\n$\u007bfound.price_usd:g\u007d\n{found.url}"
                  telegram_call(os.environ["TELEGRAM_BOT_TOKEN"],"sendPhoto",{"chat_id":os.environ["TELEGRAM_CHAT_ID"],"photo":found.photo_url,"caption":caption})
                  print("TELEGRAM_PHOTO_SENT",found.key,flush=True)
          PY
