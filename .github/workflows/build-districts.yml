name: Build Minsk district boundaries

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-districts.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch district polygons once from OpenStreetMap Nominatim
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          names = ['Центральный', 'Советский', 'Первомайский', 'Партизанский',
                   'Заводской', 'Ленинский', 'Октябрьский', 'Московский', 'Фрунзенский']
          aliases = {
              'Центральный': 'Цэнтральны', 'Советский': 'Савецкі',
              'Первомайский': 'Першамайскі', 'Партизанский': 'Партызанскі',
              'Заводской': 'Заводскі', 'Ленинский': 'Ленінскі',
              'Октябрьский': 'Кастрычніцкі', 'Московский': 'Маскоўскі',
              'Фрунзенский': 'Фрунзенскі',
          }
          output = {}
          for name in names:
              if name == 'Партизанский':
                  url = 'https://nominatim.openstreetmap.org/lookup?' + urllib.parse.urlencode({
                      'osm_ids': 'R59257', 'format': 'jsonv2', 'polygon_geojson': '1'})
              else:
                  url = 'https://nominatim.openstreetmap.org/search?' + urllib.parse.urlencode({
                      'q': f'{aliases[name]} раён, Мінск, Беларусь', 'format': 'jsonv2',
                      'polygon_geojson': '1', 'layer': 'address', 'limit': 10})
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'apartment-monitor/1.0 (https://github.com/dosenk/apartment-monitor)'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  results = json.load(response)
              chosen = next((x for x in results
                  if x.get('addresstype') == 'city_district'
                  and x.get('geojson', {}).get('type') in ('Polygon', 'MultiPolygon')
                  and 'Мінск' in x.get('display_name', '')), None)
              if chosen is None:
                  raise RuntimeError(f'No Minsk city district boundary for {name}: {results[:1]}')
              output[name] = {'osm_id': chosen['osm_id'], 'geometry': chosen['geojson']}
              print(name, chosen['osm_id'], chosen['geojson']['type'])
              time.sleep(1.2)
          Path('cloudflare/districts.json').write_text(
              json.dumps({'source': 'OpenStreetMap contributors (ODbL), via Nominatim',
                  'districts': output}, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
      - name: Commit district geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/districts.json
          git commit -m "Add Minsk district boundaries from OpenStreetMap"
          git push
