name: Deploy apartment monitor to Cloudflare

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-cloudflare.yml', '.github/scripts/cloudflare_setup.py', 'cloudflare/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BOT_ACCESS_PASSWORD: ${{ secrets.BOT_ACCESS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test parsing and search windows
        run: node --test cloudflare/*.test.mjs
      - name: Prepare database and migrate sent listings
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          python .github/scripts/cloudflare_setup.py
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Configure D1
        run: |
          npx wrangler d1 execute apartment-monitor-state --remote --file cloudflare/schema.sql
          if [ -s cloudflare/seed.sql ]; then
            npx wrangler d1 execute apartment-monitor-state --remote --file cloudflare/seed.sql
          fi
      - name: Deploy Worker and Workflow
        run: npx wrangler deploy
      - name: Configure Worker secrets
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID" | npx wrangler secret put TELEGRAM_CHAT_ID
          if [ -n "$BOT_ACCESS_PASSWORD" ]; then
            printf '%s' "$BOT_ACCESS_PASSWORD" | npx wrangler secret put BOT_ACCESS_PASSWORD
          fi
          printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -d ' ' -f1 | npx wrangler secret put WEBHOOK_SECRET
      - name: Test Worker and configure Telegram webhook
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          import urllib.error

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          request = urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain',
              headers={'Authorization': f'Bearer {token}'})
          with urllib.request.urlopen(request, timeout=30) as response:
              domain = json.load(response)['result']['subdomain']
          url = f'https://apartment-monitor-bot.{domain}.workers.dev'
          try:
              with urllib.request.urlopen(urllib.request.Request(url + '/health',
                  headers={'User-Agent': 'Mozilla/5.0 (compatible; ApartmentMonitor/1.0)'}), timeout=30) as response:
                  health = json.load(response)
                  assert health['ok']
                  print('Password login ready:', health.get('login_ready', False))
          except urllib.error.HTTPError as error:
              print('Worker health HTTP', error.code, 'URL:', url,
                    'server:', error.headers.get('Server'), 'body:', error.read(400).decode(errors='replace'))
              raise
          bot = os.environ['TELEGRAM_BOT_TOKEN']
          payload = {'url': url + '/telegram', 'secret_token': hashlib.sha256(bot.encode()).hexdigest(),
                     'allowed_updates': ['message', 'callback_query']}
          request = urllib.request.Request(f'https://api.telegram.org/bot{bot}/setWebhook',
              data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          assert result['ok'], result
          menu_payload = {'menu_button': {'type': 'web_app', 'text': 'Настройки', 'web_app': {'url': url + '/app/'}}}
          request = urllib.request.Request(f'https://api.telegram.org/bot{bot}/setChatMenuButton',
              data=json.dumps(menu_payload).encode(), headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              assert json.load(response)['ok']
          ua = {'User-Agent': 'Mozilla/5.0 (compatible; ApartmentMonitor/1.0)'}
          for path in ['/app/', '/app/app.js', '/app/style.css']:
              with urllib.request.urlopen(urllib.request.Request(url + path, headers=ua), timeout=30) as response:
                  assert response.status == 200
                  assert len(response.read()) > 100
          request = urllib.request.Request(url + '/api/session', data=b'{"initData":""}',
              headers={**ua, 'Content-Type': 'application/json'})
          try:
              urllib.request.urlopen(request, timeout=30)
              raise AssertionError('Unsigned Mini App request accepted')
          except urllib.error.HTTPError as error:
              assert error.code == 401
          import hmac
          import time
          import urllib.parse
          fields = {'auth_date': str(int(time.time())), 'user': json.dumps({'id': int(os.environ['TELEGRAM_CHAT_ID']), 'first_name': 'Owner'})}
          secret = hmac.new(b'WebAppData', bot.encode(), hashlib.sha256).digest()
          check = '\n'.join(k + '=' + fields[k] for k in sorted(fields))
          fields['hash'] = hmac.new(secret, check.encode(), hashlib.sha256).hexdigest()
          request = urllib.request.Request(url + '/api/session',
              data=json.dumps({'initData': urllib.parse.urlencode(fields)}).encode(), headers={**ua, 'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              session = json.load(response)
              assert 'catalog' in session and 'settings' in session
          print('Mini App assets, signed owner session, password gate and Telegram menu verified')
          print('Worker health verified and Telegram webhook configured:', url)
          PY
