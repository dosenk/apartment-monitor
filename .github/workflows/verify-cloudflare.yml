name: Verify Cloudflare connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check scoped API access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          token=os.environ.get('CLOUDFLARE_API_TOKEN')
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID')
          if not token or not account:
              raise SystemExit('Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets first.')
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}'
          for label,path in (
              ('Workers', '/workers/scripts'),
              ('D1', '/d1/database'),
              ('Workflows', '/workflows'),
          ):
              request=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      body=json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f'{label}: Cloudflare returned HTTP {exc.code}. Check token scope and account ID.') from None
              if not body.get('success'):
                  raise SystemExit(f'{label}: Cloudflare did not accept this token for the account.')
              print(f'{label}: API access verified',flush=True)
          PY
