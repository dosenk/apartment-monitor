name: Inspect geography sources
on:
  push:
    paths: [.github/workflows/inspect-geography.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query public data
        run: |
          python - <<'PY'
          import urllib.request,json,re,zlib,base64
          urls=[
            'https://ak.api.onliner.by/search/apartments?order=created_at%3Adesc&page=1',
            'https://api.kufar.by/search-api/v2/search/rendered-paginated?cat=1010&typ=let&size=30&sort=lst.d&lang=ru',
            'https://realt.by/rent/flat-for-long/',
            'https://raw.githubusercontent.com/jug-it/geolocation-cities/master/coord_cities_belarus.sql']
          for url in urls:
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/html','Referer':'https://re.kufar.by/'})
              with urllib.request.urlopen(request,timeout=30) as f: body=f.read()
              print('URL',url,'LENGTH',len(body))
              if 'onliner' in url:
                d=json.loads(body);print('TOP_KEYS',list(d),'PAGE',d.get('page'),'SAMPLE_LOCATIONS',[(x.get('location'),x.get('url')) for x in d.get('apartments',[])[:3]])
              elif 'kufar' in url:
                d=json.loads(body);print('KUFAR_KEYS',list(d.get('ads',[{}])[0]),'ACCOUNT',d.get('ads',[{}])[0].get('account_parameters'),'PARAMS',[(p.get('p'),p.get('vl'),p.get('v')) for p in d.get('ads',[{}])[0].get('ad_parameters',[])])
              elif 'realt' in url:
                m=re.search(r'<script[^>]*id="__NEXT_DATA__"[^>]*>(.*?)</script>',body.decode(),re.S)
                p=json.loads(m.group(1))['props']['pageProps'];print('REALT_CARD_KEYS',list(p['objects'][0]), 'GEO', {k:v for k,v in p['objects'][0].items() if 'district' in k.lower() or 'region' in k.lower() or 'town' in k.lower()})
              else:
                s=body.decode('utf-8','replace')
                rows=[]
                for match in re.finditer(r"^\s*\(\d+, '([^']*)', '([^']*)', (?:'([^']*)'|NULL), (?:'[^']*'|NULL), '([^']*)', '([^']*)', '([^']*)'",s,re.M):
                  name,obl,raion,tip,lat,lon=match.groups()
                  if tip in ('г.','гп','рп'): rows.append([name,obl,raion,tip,lat,lon])
                print('COUNTS',len(rows),'MINSK', [x for x in rows if x[0] in ('Минск','Заславль','Брест','Барановичи')])
                packed=base64.b64encode(zlib.compress(json.dumps(rows,ensure_ascii=False,separators=(',',':')).encode(),9)).decode()
                print('DATA_BEGIN')
                for i in range(0,len(packed),900):print(packed[i:i+900])
                print('DATA_END')
            except Exception as e:print('ERROR',url,repr(e))
          PY