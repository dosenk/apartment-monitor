name: Check new apartments

on:
  push:
    branches: [main]
    paths: ['.github/workflows/monitor.yml']
  schedule:
    # UTC; Minsk is UTC+3 year-round.
    - cron: '0 6 * * *'   # 09:00, publications 22:00–09:00
    - cron: '0 11 * * *'  # 14:00, publications 09:00–14:00
    - cron: '0 19 * * *'  # 22:00, publications 14:00–22:00
  workflow_dispatch:
    inputs:
      window:
        description: 'Publishing window to scan'
        type: choice
        options: [morning, midday, evening, current]
        default: current

permissions:
  contents: write

concurrency:
  group: apartment-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check Telegram configuration
        id: config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Waiting for TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets.'
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check listings and send alerts
        if: steps.config.outputs.ready == 'true' && (github.event_name != 'push' || github.event.head_commit.message == 'Scan current apartment window')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRICE_MAX_USD: '500'
          SEARCH_CENTER_LAT: '53.915833'
          SEARCH_CENTER_LON: '27.583333'
          SEARCH_RADIUS_KM: '3'
          STATE_PATH: state.json
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_WINDOW: ${{ inputs.window }}
        run: |
          case "$GITHUB_EVENT_NAME:$SCHEDULE" in
            'schedule:0 6 * * *') window=morning ;;
            'schedule:0 11 * * *') window=midday ;;
            'schedule:0 19 * * *') window=evening ;;
            'push:' ) window=current ;;
            'workflow_dispatch:' ) window="${MANUAL_WINDOW:-current}" ;;
            *) echo 'Unknown scheduled window'; exit 1 ;;
          esac
          python monitor.py --window "$window"
      - name: Persist seen listings
        if: always() && steps.config.outputs.ready == 'true'
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            cp state.json "$RUNNER_TEMP/apartment-monitor-state.json"
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          candidate = json.loads((Path(os.environ['RUNNER_TEMP']) / 'apartment-monitor-state.json').read_text())
          path = Path('state.json')
          current = json.loads(path.read_text()) if path.exists() else {}
          merged = {
              'checked_at': max(filter(None, (current.get('checked_at'), candidate.get('checked_at'))), default=None),
              'seen': sorted(set(current.get('seen', [])) | set(candidate.get('seen', []))),
          }
          path.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + '\n')
          PY
              git add state.json
              if git diff --cached --quiet; then
                exit 0
              fi
              git commit -m 'Update apartment monitor state [skip ci]'
              if git push origin HEAD:main; then
                exit 0
              fi
            done
            exit 1
          fi
