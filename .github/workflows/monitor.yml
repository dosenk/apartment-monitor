name: Check new apartments

on:
  push:
    branches: [main]
    paths: ['.github/workflows/monitor.yml']
  schedule:
    # UTC: 09:17, 15:17 and 21:17 in Minsk (UTC+3).
    - cron: '17 6,12,18 * * *'
  workflow_dispatch:
    inputs:
      send_sample:
        description: 'Send one matching apartment as a test notification'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apartment-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check Telegram configuration
        id: config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Waiting for TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets.'
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Send one sample apartment
        if: inputs.send_sample == true && steps.config.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRICE_MAX_USD: '500'
          SEARCH_CENTER_LAT: '53.915833'
          SEARCH_CENTER_LON: '27.583333'
          SEARCH_RADIUS_KM: '3'
        run: |
          python - <<'PY'
          import os
          from dataclasses import replace
          from datetime import datetime, timedelta, timezone
          from monitor import fetch_onliner, matches, telegram_send

          center = (float(os.environ['SEARCH_CENTER_LAT']), float(os.environ['SEARCH_CENTER_LON']))
          listings = fetch_onliner(datetime.now(timezone.utc) - timedelta(hours=24))
          matches_now = [item for item in listings if matches(
              item, float(os.environ['PRICE_MAX_USD']), None, set(), None,
              center, float(os.environ['SEARCH_RADIUS_KM']))]
          if not matches_now:
              raise SystemExit('No matching Onliner apartment is available for the sample')
          item = max(matches_now, key=lambda apartment: apartment.published_at)
          print(f'Test listing {item.key}: {item.url}', flush=True)
          telegram_send(os.environ['TELEGRAM_BOT_TOKEN'], os.environ['TELEGRAM_CHAT_ID'],
                        replace(item, address='ТЕСТ · ' + item.address))
          print(f'Sent sample listing {item.key}')
          PY
      - name: Check listings and send alerts
        if: steps.config.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRICE_MAX_USD: '500'
          SEARCH_CENTER_LAT: '53.915833'
          SEARCH_CENTER_LON: '27.583333'
          SEARCH_RADIUS_KM: '3'
          STATE_PATH: state.json
        run: python monitor.py
      - name: Persist seen listings
        if: always() && steps.config.outputs.ready == 'true'
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            cp state.json "$RUNNER_TEMP/apartment-monitor-state.json"
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          candidate = json.loads((Path(os.environ['RUNNER_TEMP']) / 'apartment-monitor-state.json').read_text())
          path = Path('state.json')
          current = json.loads(path.read_text()) if path.exists() else {}
          merged = {
              'checked_at': max(filter(None, (current.get('checked_at'), candidate.get('checked_at'))), default=None),
              'seen': sorted(set(current.get('seen', [])) | set(candidate.get('seen', []))),
          }
          path.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + '\n')
          PY
              git add state.json
              if git diff --cached --quiet; then
                exit 0
              fi
              git commit -m 'Update apartment monitor state [skip ci]'
              if git push origin HEAD:main; then
                exit 0
              fi
            done
            exit 1
          fi
