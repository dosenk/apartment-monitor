name: Verify recovered Telegram menu
on:
  push:
    paths: ['.github/workflows/diagnose-telegram-safe.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Verify frequency navigation and deliver restored settings
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,hashlib,time
          bot=os.environ['TELEGRAM_BOT_TOKEN']
          chat=int(os.environ['TELEGRAM_CHAT_ID'])
          def call(url,payload=None,headers={}):
              req=urllib.request.Request(url,data=json.dumps(payload).encode() if payload else None,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0 (compatible; ApartmentMonitor/1.0)',**headers})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  e.read()
                  return {'ok':False,'http_status':e.code}
          base=f'https://api.telegram.org/bot{bot}/'
          info=call(base+'getWebhookInfo')['result']
          assert '.workers.dev/telegram' in info['url']
          seed=call(base+'sendMessage',{'chat_id':chat,'text':'🔧 Проверяю меню частоты. Здесь появятся восстановленные настройки.'})
          assert seed['ok']
          mid=seed['result']['message_id']
          for step,action in enumerate(['frequency','frequency','home']):
              result=call(info['url'],{'update_id':int(time.time())+step,'callback_query':{'id':'diagnostic-expired-callback','data':'prefs:'+action,'message':{'message_id':mid,'chat':{'id':chat}}}},{'X-Telegram-Bot-Api-Secret-Token':hashlib.sha256(bot.encode()).hexdigest()})
              print('Menu step',action,'ok:',result.get('ok',False),'HTTP:',result.get('http_status',200))
              assert result.get('ok'), 'Menu verification failed; see anonymized HTTP status above.'
          print('Pending updates:',call(base+'getWebhookInfo')['result'].get('pending_update_count',0))
          print('Restored settings menu delivered. Saved search preferences unchanged.')
          PY
