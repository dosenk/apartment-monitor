name: Inspect district fields and listing page counts

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-districts.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public listing fields
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request

          urls = {
              'onliner': 'https://ak.api.onliner.by/search/apartments?rent_type%5B%5D=1_room&order=created_at%3Adesc&page=1',
              'realt': 'https://realt.by/rent/flat-for-long/',
              'kufar': 'https://api.kufar.by/search-api/v2/search/rendered-paginated?cat=1010&typ=let&rgn=7&size=100&sort=lst.d&lang=ru',
          }
          for name, url in urls.items():
              headers = {'User-Agent': 'Mozilla/5.0 Chrome/131.0 Safari/537.36',
                         'Accept': 'application/json,text/html'}
              if name == 'kufar':
                  headers['Referer'] = 'https://re.kufar.by/'
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=25) as response:
                      raw = response.read().decode()
                  if name == 'realt':
                      match = re.search(r'<script[^>]*id="__NEXT_DATA__"[^>]*>(.*?)</script>', raw, re.S)
                      page = json.loads(match.group(1))['props']['pageProps']
                      items = page.get('objects', [])
                      meta = page.get('pagination', {})
                  else:
                      data = json.loads(raw)
                      items = data.get('apartments' if name == 'onliner' else 'ads', [])
                      meta = data.get('page' if name == 'onliner' else 'pagination')
                  print(name, 'count=', len(items), 'page=', str(meta)[:350])
                  for item in items[:2]:
                      print(' keys:', list(item.keys()))
                      print(' district-like:', {k: v for k,v in item.items() if any(t in k.lower() for t in ['district','area','region','rajon'])})
                      print(' location:', str(item.get('location'))[:500])
                      if name == 'kufar':
                          print(' parameters:', str(item.get('ad_parameters'))[:600])
              except Exception as error:
                  print(name, type(error).__name__, str(error)[:150])
          PY
