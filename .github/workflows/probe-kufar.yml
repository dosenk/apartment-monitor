name: Probe Kufar listing data
on:
  push:
    paths: ['.github/workflows/probe-kufar.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public search responses
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import urllib.request
          import urllib.error
          endpoints = {
            'api': 'https://api.kufar.by/search-api/v2/search/rendered-paginated?cat=1010&typ=let&rgn=7&size=2&sort=lst.d',
            'cre': 'https://cre-api.kufar.by/ads-search/v1/engine/v1/search/rendered-paginated?cat=1010&typ=let&rgn=7&size=2&sort=lst.d',
            'page': 'https://re.kufar.by/l/minsk/snyat/kvartiru',
          }
          def inspect(entry):
              name, url = entry
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36', 'Accept':'application/json,text/html', 'Referer':'https://re.kufar.by/'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body=r.read(2000000).decode('utf-8','replace')
                      print(name, 'status', r.status, 'length',len(body),'type',r.headers.get('Content-Type'),flush=True)
                      if 'json' in r.headers.get('Content-Type',''):
                          data=json.loads(body)
                          print(name,'top keys',list(data) if isinstance(data,dict) else type(data),flush=True)
                          ads=data.get('ads',[]) if isinstance(data,dict) else []
                          if ads: print(name,'first ad',json.dumps(ads[0],ensure_ascii=False)[:7000],flush=True)
                      else:
                          print(name,'html markers',[(marker,body.find(marker)) for marker in ('__NEXT_DATA__','__NUXT_DATA__','__next_f','__INITIAL_STATE__')],flush=True)
                          print(name,'html snippet',body[:500],flush=True)
              except urllib.error.HTTPError as e: print(name,'HTTP',e.code,e.read(200).decode('utf-8','replace'),flush=True)
              except Exception as e: print(name,type(e).__name__,str(e)[:300],flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: list(pool.map(inspect,endpoints.items()))
          PY
